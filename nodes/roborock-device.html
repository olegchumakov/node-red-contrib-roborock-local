<script type="text/html" data-template-name="roborock-device">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> <span data-i18n="node-red:common.label.name"></span></label>
        <input type="text" id="node-config-input-name" data-i18n="[placeholder]roborock-device.placeholder.name">
    </div>
    <div class="form-row">
        <label for="node-config-input-account"><i class="fa fa-user"></i> <span data-i18n="roborock-device.label.account"></span></label>
        <input type="text" id="node-config-input-account">
    </div>
    <div class="form-row">
        <button type="button" class="red-ui-button" id="rr-fetch-account" data-i18n="roborock-device.fetch"></button>
    </div>
    <div class="form-tips" data-i18n="roborock-device.tipAccount"></div>
    <div id="rr-device-list" style="margin:8px 0;"></div>
    <div class="form-tips" id="rr-device-status" data-i18n="roborock-device.tipKey"></div>

    <hr>
    <div class="form-row">
        <label for="node-config-input-deviceName"><i class="fa fa-android"></i> <span data-i18n="roborock-device.label.vacuum"></span></label>
        <input type="text" id="node-config-input-deviceName" data-i18n="[placeholder]roborock-device.placeholder.vacuum">
    </div>
    <div class="form-row">
        <label for="node-config-input-ip"><i class="fa fa-desktop"></i> <span data-i18n="roborock-device.label.ip"></span></label>
        <input type="text" id="node-config-input-ip" placeholder="192.168.1.20" autocomplete="off">
    </div>
    <div class="form-row">
        <label for="node-config-input-duid"><i class="fa fa-barcode"></i> <span data-i18n="roborock-device.label.duid"></span></label>
        <input type="text" id="node-config-input-duid" autocomplete="off">
    </div>
    <div class="form-row">
        <label for="node-config-input-localKey"><i class="fa fa-key"></i> <span data-i18n="roborock-device.label.localKey"></span></label>
        <input type="password" id="node-config-input-localKey" autocomplete="new-password">
    </div>
    <div class="form-row">
        <label for="node-config-input-model"><i class="fa fa-info-circle"></i> <span data-i18n="roborock-device.label.model"></span></label>
        <input type="text" id="node-config-input-model" placeholder="roborock.vacuum.xxx">
    </div>
    <div class="form-row">
        <label for="node-config-input-protocol"><i class="fa fa-exchange"></i> <span data-i18n="roborock-device.label.protocol"></span></label>
        <select id="node-config-input-protocol" style="width:70%">
            <option value="auto" data-i18n="roborock-device.protocol.auto"></option>
            <option value="1.0">1.0</option>
            <option value="L01">L01</option>
        </select>
    </div>
    <div class="form-tips" data-i18n="roborock-device.tipProtocol"></div>
    <div class="form-row">
        <button type="button" class="red-ui-button" id="rr-discover" data-i18n="roborock-device.discover"></button>
    </div>
    <div class="form-tips" data-i18n="roborock-device.tipDiscover"></div>
    <div class="form-row">
        <button type="button" class="red-ui-button" id="rr-show-maps" data-i18n="roborock-device.showMaps"></button>
    </div>
    <div id="rr-map-list" style="margin:8px 0;"></div>
    <div class="form-tips" id="rr-map-note"></div>
    <div class="form-tips" data-i18n="[html]roborock-device.tipMaps"></div>
    <input type="hidden" id="node-config-input-firmware">
    <input type="hidden" id="node-config-input-pv">
</script>

<script type="text/javascript">
(function () {
    function t(key, options) {
        return RED._("roborock-device." + key, options);
    }
    function postJSON(url, body) {
        return $.ajax({
            url: url,
            type: "POST",
            contentType: "application/json; charset=UTF-8",
            data: JSON.stringify(body),
            dataType: "json"
        });
    }
    function escapeHtml(value) {
        return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }
    function setStatus(text, isError) {
        $("#rr-device-status").text(text).css("color", isError ? "#a00" : "");
    }
    // A value that differs from credentials._ was typed in the editor and is not deployed yet.
    // "__PWRD__" means the secret already lives on the server.
    function pendingCredential(account, name) {
        const creds = account && account.credentials;
        if (!creds) {
            return "";
        }
        const value = creds[name];
        if (value == null || value === "" || value === "__PWRD__") {
            return "";
        }
        const original = creds._ ? creds._[name] : undefined;
        if (original !== undefined && value === original) {
            return "";
        }
        return value;
    }
    function accountLikelySignedIn(accountId) {
        const account = RED.nodes.node(accountId);
        if (!account || !account.credentials) {
            return true;
        }
        const creds = account.credentials;
        if (pendingCredential(account, "userData")) {
            return true;
        }
        if (creds.has_userData) {
            return true;
        }
        return Boolean(creds.userData && creds.userData !== "__PWRD__");
    }
    RED.nodes.registerType("roborock-device", {
        category: "config",
        defaults: {
            name: { value: "" },
            account: { value: "", type: "roborock-account" },
            deviceName: { value: "" },
            protocol: { value: "auto" },
            firmware: { value: "" },
            pv: { value: "" }
        },
        credentials: {
            ip: { type: "text" },
            duid: { type: "text" },
            localKey: { type: "password" },
            model: { type: "text" }
        },
        label: function () {
            return this.name || this.deviceName || this._("roborock-device.name");
        },
        oneditprepare: function () {
            const node = this;
            function setMapNote(text) {
                $("#rr-map-note").text(text || "");
            }
            function segmentLabel(segment) {
                return segment.name ? (segment.segmentId + " " + segment.name) : String(segment.segmentId);
            }
            let mapBusy = false;
            function cachedLabel(iso) {
                const text = String(iso || "").replace("T", " ").replace(/\.\d+Z$/, "Z");
                return t("cachedAt", { time: text || iso });
            }
            function requestBody() {
                const key = $("#node-config-input-localKey").val();
                const body = {
                    ip: $("#node-config-input-ip").val(),
                    duid: $("#node-config-input-duid").val(),
                    protocol: $("#node-config-input-protocol").val(),
                    pv: $("#node-config-input-pv").val(),
                    nodeId: node.id,
                    accountId: $("#node-config-input-account").val() || ""
                };
                if (key && key !== "__PWRD__") {
                    body.localKey = key;
                }
                return body;
            }
            function renderCatalog(data) {
                const host = $("#rr-map-list").empty();
                const maps = data.maps || [];
                if (!maps.length) {
                    host.append($("<div class='form-tips'></div>").text(data.mapsError || t("noMaps")));
                }
                maps.forEach(function (map) {
                    const block = $("<div style='margin:6px 0'></div>");
                    const title = (map.name || t("mapDefault", { flag: map.mapFlag })) + " · " + t("mapNo", { flag: map.mapFlag }) + (map.current ? " (" + t("loaded") + ")" : "");
                    block.append($("<div></div>").text(title));
                    if (map.segments && map.segments.length) {
                        map.segments.forEach(function (segment) {
                            block.append($("<div class='form-tips'></div>").text(t("room", { label: segmentLabel(segment) })));
                        });
                    } else if (map.note) {
                        block.append($("<div class='form-tips'></div>").text(map.note));
                    }
                    if (map.cached && map.cachedAt) {
                        block.append($("<div class='form-tips'></div>").text(cachedLabel(map.cachedAt)));
                    }
                    if (map.current) {
                        const reload = $("<button type='button' class='red-ui-button'></button>").text(t("reload"));
                        reload.on("click", function () {
                            showMaps("reload");
                        });
                        block.append(reload);
                    } else {
                        const load = $("<button type='button' class='red-ui-button'></button>").text(t("loadThis"));
                        load.on("click", function () {
                            loadMap(map);
                        });
                        block.append(load);
                    }
                    host.append(block);
                });
                if (data.loadedSegments && data.loadedSegments.length) {
                    const extra = $("<div style='margin:6px 0'></div>");
                    extra.append($("<div class='form-tips'></div>").text(data.loadedSegmentsNote || t("loadedRooms")));
                    data.loadedSegments.forEach(function (segment) {
                        extra.append($("<div class='form-tips'></div>").text(t("room", { label: segmentLabel(segment) })));
                    });
                    host.append(extra);
                }
            }
            function showMapError(xhr, fallback) {
                setMapNote((xhr.responseJSON && xhr.responseJSON.error) || fallback);
            }
            function showMaps(action) {
                if (mapBusy) {
                    return;
                }
                const body = requestBody();
                body.action = action || "read";
                mapBusy = true;
                setMapNote(body.action === "reload" ? t("reloading") : t("reading"));
                postJSON("roborock-local/map-rooms", body).done(function (data) {
                    renderCatalog(data);
                    if (data.mappingError) {
                        setMapNote(t("partial", { error: data.mappingError }));
                    } else {
                        setMapNote("");
                    }
                }).fail(function (xhr) {
                    showMapError(xhr, t("readFailed"));
                }).always(function () {
                    mapBusy = false;
                });
            }
            function restoreMap(mapFlag) {
                const body = requestBody();
                body.action = "restore";
                body.mapFlag = Number(mapFlag);
                body.confirmed = true;
                mapBusy = true;
                setMapNote(t("switchingBack", { flag: mapFlag }));
                postJSON("roborock-local/map-rooms", body).done(function (data) {
                    renderCatalog(data);
                    setMapNote("");
                }).fail(function (xhr) {
                    showMapError(xhr, t("switchBackFailed"));
                }).always(function () {
                    mapBusy = false;
                });
            }
            function loadMap(map) {
                if (mapBusy) {
                    return;
                }
                const name = map.name || t("mapNo", { flag: map.mapFlag });
                if (!confirm(t("confirmLoad", { name: name, flag: map.mapFlag }))) {
                    return;
                }
                const body = requestBody();
                body.action = "load";
                body.mapFlag = Number(map.mapFlag);
                body.confirmed = true;
                mapBusy = true;
                let followUp = false;
                setMapNote(t("loading", { flag: map.mapFlag }));
                postJSON("roborock-local/map-rooms", body).done(function (data) {
                    renderCatalog(data);
                    if (data.mapSwitchUnconfirmed) {
                        setMapNote(t("unconfirmed", { flag: map.mapFlag }));
                    } else {
                        setMapNote("");
                    }
                    const previous = data.previousMapFlag;
                    if (previous !== null && previous !== undefined && previous !== data.currentMapFlag) {
                        const prev = (data.maps || []).find(function (item) { return item.mapFlag === previous; });
                        const prevName = prev && prev.name ? prev.name : t("mapNo", { flag: previous });
                        if (confirm(t("confirmBack", { name: name, prev: prevName, flag: previous }))) {
                            followUp = true;
                            restoreMap(previous);
                        }
                    }
                }).fail(function (xhr) {
                    showMapError(xhr, t("loadFailed"));
                }).always(function () {
                    if (!followUp) {
                        mapBusy = false;
                    }
                });
            }
            function applyDevice(device) {
                $("#node-config-input-duid").val(device.duid || "");
                $("#node-config-input-localKey").val(device.localKey || "");
                $("#node-config-input-model").val(device.model || "");
                $("#node-config-input-deviceName").val(device.name || "");
                $("#node-config-input-firmware").val(device.firmware || "");
                if (device.pv) {
                    $("#node-config-input-pv").val(device.pv);
                }
                if (device.ip) {
                    $("#node-config-input-ip").val(device.ip);
                }
                if (!$("#node-config-input-name").val()) {
                    $("#node-config-input-name").val(device.name || "");
                }
                setStatus(t(device.ip ? "selected" : "selectedNoIp", { name: device.name || device.duid }));
            }
            function renderDevices(devices) {
                const host = $("#rr-device-list").empty();
                if (!devices || !devices.length) {
                    host.text(t("noVacuums"));
                    return;
                }
                devices.forEach(function (device) {
                    const label = [
                        device.name || t("vacuumDefault"),
                        device.model || "",
                        device.firmware ? t("firmware", { version: device.firmware }) : "",
                        device.ip || t("ipUnknown"),
                        device.online === false ? t("offline") : ""
                    ].filter(Boolean).join(" · ");
                    const button = $("<button type='button' class='red-ui-button' style='display:block;margin:4px 0;text-align:left;'></button>");
                    button.text(label);
                    button.on("click", function () {
                        applyDevice(device);
                    });
                    host.append(button);
                });
            }
            function showDevices(data, autoFill) {
                const devices = data.devices || [];
                renderDevices(devices);
                if (autoFill && devices.length === 1 && !$("#node-config-input-duid").val()) {
                    applyDevice(devices[0]);
                    return;
                }
                const extra = data.discoveryError ? " " + t("discoveryError", { error: data.discoveryError }) : "";
                const picked = devices.length > 1 ? " " + t("pick") : "";
                setStatus((data.message || t("found", { count: devices.length })) + picked + extra);
            }
            function accountRequest(accountId) {
                const account = RED.nodes.node(accountId);
                const body = { nodeId: accountId, discover: true };
                if (!account) {
                    return body;
                }
                if (account.region) {
                    body.region = account.region;
                }
                if (account.baseUrl) {
                    body.baseUrl = account.baseUrl;
                }
                const userData = pendingCredential(account, "userData");
                const email = pendingCredential(account, "email");
                const clientId = pendingCredential(account, "clientId");
                if (userData) {
                    body.userData = userData;
                }
                if (email) {
                    body.email = email;
                }
                if (clientId) {
                    body.clientId = clientId;
                }
                return body;
            }
            function fetchFromAccount(autoFill) {
                const accountId = $("#node-config-input-account").val();
                if (!accountId) {
                    setStatus(t("selectAccount"), true);
                    return;
                }
                setStatus(t("loadingDevices"));
                postJSON("roborock-local/devices", accountRequest(accountId)).done(function (data) {
                    showDevices(data, autoFill);
                }).fail(function (xhr) {
                    setStatus((xhr.responseJSON && xhr.responseJSON.error) || t("loadDevicesFailed"), true);
                });
            }
            $("#node-config-input-account").on("change", function () {
                const accountId = $("#node-config-input-account").val();
                if (!accountId || $("#node-config-input-duid").val()) {
                    return;
                }
                if (!accountLikelySignedIn(accountId)) {
                    return;
                }
                fetchFromAccount(true);
            });
            $("#rr-fetch-account").on("click", function () {
                fetchFromAccount(!$("#node-config-input-duid").val());
            });
            $("#rr-discover").on("click", function () {
                setStatus(t("listening"));
                postJSON("roborock-local/discover", { timeoutMs: 8000 }).done(function (data) {
                    const list = data.devices || [];
                    if (!list.length) {
                        setStatus(t("nothingHeard"), true);
                        return;
                    }
                    const duid = $("#node-config-input-duid").val();
                    const match = duid ? list.find(function (item) { return item.duid === duid; }) : null;
                    if (match) {
                        $("#node-config-input-ip").val(match.ip);
                        setStatus(t("foundAt", { duid: match.duid, ip: match.ip }));
                        return;
                    }
                    const lines = list.map(function (item) {
                        return escapeHtml(item.duid) + " · " + escapeHtml(item.ip) + " · " + escapeHtml(item.version);
                    }).join("<br>");
                    $("#rr-device-list").html("<div class='form-tips'>" + escapeHtml(t("heardOnLan")) + "<br>" + lines + "</div>");
                    if (list.length === 1 && !$("#node-config-input-ip").val()) {
                        $("#node-config-input-ip").val(list[0].ip);
                        if (!$("#node-config-input-duid").val()) {
                            $("#node-config-input-duid").val(list[0].duid);
                        }
                    }
                    setStatus(t("heardCount", { count: list.length }));
                }).fail(function (xhr) {
                    setStatus((xhr.responseJSON && xhr.responseJSON.error) || t("discoveryFailed"), true);
                });
            });
            $("#rr-show-maps").on("click", function () {
                showMaps();
            });
        }
    });
})();
</script>
