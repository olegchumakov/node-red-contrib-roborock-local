<script type="text/html" data-template-name="roborock-device">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="Downstairs S7">
    </div>
    <div class="form-row">
        <label for="node-config-input-account"><i class="fa fa-user"></i> Account</label>
        <input type="text" id="node-config-input-account">
    </div>
    <div class="form-row">
        <button type="button" class="red-ui-button" id="rr-fetch-account">Fetch devices from account</button>
    </div>
    <div class="form-tips">Sign in on the roborock account node and click Done. Then pick the vacuum here. You do not need to deploy in between. One account can be used by several vacuums.</div>
    <div id="rr-device-list" style="margin:8px 0;"></div>
    <div class="form-tips" id="rr-device-status">The local key is stored in credentials and is not written into the exported flow.</div>

    <hr>
    <div class="form-row">
        <label for="node-config-input-deviceName"><i class="fa fa-android"></i> Vacuum</label>
        <input type="text" id="node-config-input-deviceName" placeholder="name from the app">
    </div>
    <div class="form-row">
        <label for="node-config-input-ip"><i class="fa fa-desktop"></i> IP</label>
        <input type="text" id="node-config-input-ip" placeholder="192.168.1.20" autocomplete="off">
    </div>
    <div class="form-row">
        <label for="node-config-input-duid"><i class="fa fa-barcode"></i> DUID</label>
        <input type="text" id="node-config-input-duid" autocomplete="off">
    </div>
    <div class="form-row">
        <label for="node-config-input-localKey"><i class="fa fa-key"></i> Local key</label>
        <input type="password" id="node-config-input-localKey" autocomplete="new-password">
    </div>
    <div class="form-row">
        <label for="node-config-input-model"><i class="fa fa-info-circle"></i> Model</label>
        <input type="text" id="node-config-input-model" placeholder="roborock.vacuum.a15">
    </div>
    <div class="form-row">
        <label for="node-config-input-protocol"><i class="fa fa-exchange"></i> Protocol</label>
        <select id="node-config-input-protocol" style="width:70%">
            <option value="auto">Auto (saved protocol, else 1.0 then L01)</option>
            <option value="1.0">1.0 — S7 and most robots</option>
            <option value="L01">L01</option>
        </select>
    </div>
    <div class="form-row">
        <button type="button" class="red-ui-button" id="rr-discover">Find on LAN</button>
    </div>
    <div class="form-tips">The cloud response usually has no IP. Discovery listens for a few seconds on UDP 58866. If Home Assistant's Roborock integration is already bound to that port on this machine, type the IP. IP, DUID, local key, and model are credentials, not flow properties.</div>
    <div class="form-row">
        <button type="button" class="red-ui-button" id="rr-show-maps">Show maps &amp; rooms</button>
    </div>
    <div id="rr-map-list" style="margin:8px 0;"></div>
    <div class="form-tips" id="rr-map-note"></div>
    <div class="form-tips">Read-only reference. Nothing here is saved, and the robot's loaded map is not changed. Switch floors and clean rooms with vacuum commands, for example <code>{"command":"map","mapFlag":1}</code> and <code>{"command":"rooms","segments":[16]}</code>.</div>
    <input type="hidden" id="node-config-input-firmware">
    <input type="hidden" id="node-config-input-pv">
</script>

<script type="text/html" data-help-name="roborock-device">
    <p>Connection settings for one Roborock vacuum on the local network. <code>local_key</code>, DUID, model, and IP are stored as Node-RED credentials and are omitted from flow exports. Cloud login is only on the <b>roborock account</b> node. One account can supply several vacuums.</p>
    <h3>Get the key</h3>
    <ol>
        <li>Add a <b>roborock account</b> from the Account field, sign in (email code, password, or a Home Assistant session), and click <b>Done</b>. Do not deploy yet.</li>
        <li>Back on this node, <b>Fetch devices from account</b> lists the vacuums. If this device has no DUID yet and the account has one vacuum, the fields are filled in for you.</li>
        <li>Click <b>Find on LAN</b> if the IP is empty, or type it.</li>
        <li>Click <b>Done</b>, then <b>Deploy</b> once. After that the vacuum node does not need the cloud.</li>
    </ol>
    <h3>Credentials, not config</h3>
    <p><code>ip</code>, <code>duid</code>, <code>localKey</code>, and <code>model</code> are Node-RED credentials. They are not properties of the node config, and they are omitted from an exported flow. In the editor, type them in those fields and deploy.</p>
    <p>The Admin API <code>POST /flows</code> with the default <code>Node-RED-API-Version: v1</code> takes a <b>raw array</b>. Put the secrets on that node's <code>credentials</code> object. Node-RED copies them into the credential store and does not keep them in <code>flows.json</code>:</p>
    <pre>[
  {
    "id": "device1",
    "type": "roborock-device",
    "name": "S7",
    "account": "account1",
    "protocol": "auto",
    "pv": "1.0",
    "credentials": {
      "ip": "192.168.1.20",
      "duid": "YOUR_DUID",
      "localKey": "YOUR_LOCAL_KEY",
      "model": "roborock.vacuum.a15"
    }
  }
]</pre>
    <h3>Manual entry</h3>
    <p>Paste IP, DUID, and local_key if you already have them (for example from <code>roborock-cloud-login</code>). An account is optional when those values are already filled in.</p>
    <h3>Refreshing a key</h3>
    <p>Re-pairing or a Wi-Fi reset rotates <code>local_key</code>. Sign in on the account node if the saved session expired, fetch the device again, and deploy. Timeouts and "decrypt failed" point at a stale key or a wrong IP, not at the cloud.</p>
    <h3>Maps and rooms</h3>
    <p><b>Show maps &amp; rooms</b> asks the robot for its floors and room ids and prints them in this dialog. It does not save anything on the node, and it does not call <code>load_multi_map</code>. The loaded floor is marked <code>(loaded)</code>.</p>
    <p><code>get_room_mapping</code> returns segments only for the loaded map, as <code>[segmentId, cloudRoomId, tag]</code>. An empty list means that loaded map reported no rooms. Other floors are listed from <code>get_multi_maps_list</code>. When that response includes a <code>rooms</code> array, those ids are shown too. When it does not, the line is <code>rooms visible when this map is loaded</code>. Switch first with a vacuum command, then show the list again, to see that floor's segments.</p>
    <p>A room name is shown beside an id only when it is actually tied to that segment: either <code>get_room_mapping</code> links the segment to a cloud home room id from the account session, or the map list itself sent <code>iot_name</code> on that room. Home rooms that are not linked (old names still sitting on the account) are not shown. If the account session is missing, you still get the ids.</p>
    <p>Control stays on the vacuum node:</p>
    <pre>{"command":"map_rooms"}
{"command":"map","mapFlag":1}
{"command":"rooms","segments":[16,17]}
{"command":"rooms","names":["Kitchen"]}</pre>
    <p>Auto protocol uses the account <code>pv</code> when it is <code>1.0</code> and does not wait for an L01 hello. Choosing L01 still tries L01 and reports <code>No CONNACK for L01</code> if the firmware does not speak it.</p>
    <p>A cloud session that was saved on this device node in an older version is ignored. Local control keeps using the IP, DUID, and local key.</p>
</script>

<script type="text/javascript">
(function () {
    function postJSON(url, body) {
        return $.ajax({
            url: url,
            type: "POST",
            contentType: "application/json; charset=UTF-8",
            data: JSON.stringify(body),
            dataType: "json"
        });
    }
    function escapeHtml(value) {
        return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }
    function setStatus(text, isError) {
        $("#rr-device-status").text(text).css("color", isError ? "#a00" : "");
    }
    // A value that differs from credentials._ was typed in the editor and is not deployed yet.
    // "__PWRD__" means the secret already lives on the server.
    function pendingCredential(account, name) {
        const creds = account && account.credentials;
        if (!creds) {
            return "";
        }
        const value = creds[name];
        if (value == null || value === "" || value === "__PWRD__") {
            return "";
        }
        const original = creds._ ? creds._[name] : undefined;
        if (original !== undefined && value === original) {
            return "";
        }
        return value;
    }
    function accountLikelySignedIn(accountId) {
        const account = RED.nodes.node(accountId);
        if (!account || !account.credentials) {
            return true;
        }
        const creds = account.credentials;
        if (pendingCredential(account, "userData")) {
            return true;
        }
        if (creds.has_userData) {
            return true;
        }
        return Boolean(creds.userData && creds.userData !== "__PWRD__");
    }
    RED.nodes.registerType("roborock-device", {
        category: "config",
        defaults: {
            name: { value: "" },
            account: { value: "", type: "roborock-account" },
            deviceName: { value: "" },
            protocol: { value: "auto" },
            firmware: { value: "" },
            pv: { value: "" }
        },
        credentials: {
            ip: { type: "text" },
            duid: { type: "text" },
            localKey: { type: "password" },
            model: { type: "text" }
        },
        label: function () {
            return this.name || this.deviceName || "roborock device";
        },
        oneditprepare: function () {
            const node = this;
            function setMapNote(text) {
                $("#rr-map-note").text(text || "");
            }
            function segmentLabel(segment) {
                return segment.name ? (segment.segmentId + " " + segment.name) : String(segment.segmentId);
            }
            function renderCatalog(data) {
                const host = $("#rr-map-list").empty();
                const maps = data.maps || [];
                if (!maps.length) {
                    host.append($("<div class='form-tips'></div>").text(data.mapsError || "No saved maps returned."));
                }
                maps.forEach(function (map) {
                    const block = $("<div style='margin:6px 0'></div>");
                    const title = (map.name || ("Map " + map.mapFlag)) + " · map " + map.mapFlag + (map.current ? " (loaded)" : "");
                    block.append($("<div></div>").text(title));
                    if (map.segments && map.segments.length) {
                        map.segments.forEach(function (segment) {
                            block.append($("<div class='form-tips'></div>").text("room " + segmentLabel(segment)));
                        });
                    } else if (map.note) {
                        block.append($("<div class='form-tips'></div>").text(map.note));
                    }
                    host.append(block);
                });
                if (data.loadedSegments && data.loadedSegments.length) {
                    const extra = $("<div style='margin:6px 0'></div>");
                    extra.append($("<div class='form-tips'></div>").text(data.loadedSegmentsNote || "Loaded map rooms"));
                    data.loadedSegments.forEach(function (segment) {
                        extra.append($("<div class='form-tips'></div>").text("room " + segmentLabel(segment)));
                    });
                    host.append(extra);
                }
            }
            function showMaps() {
                const key = $("#node-config-input-localKey").val();
                const body = {
                    ip: $("#node-config-input-ip").val(),
                    duid: $("#node-config-input-duid").val(),
                    protocol: $("#node-config-input-protocol").val(),
                    pv: $("#node-config-input-pv").val(),
                    nodeId: node.id,
                    accountId: $("#node-config-input-account").val() || ""
                };
                if (key && key !== "__PWRD__") {
                    body.localKey = key;
                }
                setMapNote("Reading maps...");
                postJSON("roborock-local/map-rooms", body).done(function (data) {
                    renderCatalog(data);
                    if (data.mappingError) {
                        setMapNote("Could not read rooms for the loaded map. Floors are still listed. " + data.mappingError);
                    } else {
                        setMapNote("");
                    }
                }).fail(function (xhr) {
                    setMapNote((xhr.responseJSON && xhr.responseJSON.error) || "Could not read maps");
                });
            }
            function applyDevice(device) {
                $("#node-config-input-duid").val(device.duid || "");
                $("#node-config-input-localKey").val(device.localKey || "");
                $("#node-config-input-model").val(device.model || "");
                $("#node-config-input-deviceName").val(device.name || "");
                $("#node-config-input-firmware").val(device.firmware || "");
                if (device.pv) {
                    $("#node-config-input-pv").val(device.pv);
                }
                if (device.ip) {
                    $("#node-config-input-ip").val(device.ip);
                }
                if (!$("#node-config-input-name").val()) {
                    $("#node-config-input-name").val(device.name || "");
                }
                const protocolNote = device.pv === "1.0" ? " Protocol 1.0 from the account; auto will not try L01." : "";
                setStatus("Selected " + (device.name || device.duid) + ". Click Done, then Deploy once" + (device.ip ? "." : ", then set the IP or use Find on LAN.") + protocolNote);
            }
            function renderDevices(devices) {
                const host = $("#rr-device-list").empty();
                if (!devices || !devices.length) {
                    host.text("No vacuums returned.");
                    return;
                }
                devices.forEach(function (device) {
                    const label = [
                        device.name || "Vacuum",
                        device.model || "",
                        device.firmware ? "fw " + device.firmware : "",
                        device.ip || "IP unknown",
                        device.online === false ? "offline in cloud" : ""
                    ].filter(Boolean).join(" · ");
                    const button = $("<button type='button' class='red-ui-button' style='display:block;margin:4px 0;text-align:left;'></button>");
                    button.text(label);
                    button.on("click", function () {
                        applyDevice(device);
                    });
                    host.append(button);
                });
            }
            function showDevices(data, autoFill) {
                const devices = data.devices || [];
                renderDevices(devices);
                if (autoFill && devices.length === 1 && !$("#node-config-input-duid").val()) {
                    applyDevice(devices[0]);
                    return;
                }
                const extra = data.discoveryError ? " LAN discovery: " + data.discoveryError : "";
                const picked = devices.length > 1 ? " Pick a vacuum." : "";
                setStatus((data.message || ("Found " + devices.length + " device(s).")) + picked + extra);
            }
            function accountRequest(accountId) {
                const account = RED.nodes.node(accountId);
                const body = { nodeId: accountId, discover: true };
                if (!account) {
                    return body;
                }
                if (account.region) {
                    body.region = account.region;
                }
                if (account.baseUrl) {
                    body.baseUrl = account.baseUrl;
                }
                const userData = pendingCredential(account, "userData");
                const email = pendingCredential(account, "email");
                const clientId = pendingCredential(account, "clientId");
                if (userData) {
                    body.userData = userData;
                }
                if (email) {
                    body.email = email;
                }
                if (clientId) {
                    body.clientId = clientId;
                }
                return body;
            }
            function fetchFromAccount(autoFill) {
                const accountId = $("#node-config-input-account").val();
                if (!accountId) {
                    setStatus("Select a roborock account. Sign in there and click Done. Deploy is not required before the fetch.", true);
                    return;
                }
                setStatus("Loading devices...");
                postJSON("roborock-local/devices", accountRequest(accountId)).done(function (data) {
                    showDevices(data, autoFill);
                }).fail(function (xhr) {
                    setStatus((xhr.responseJSON && xhr.responseJSON.error) || "Could not load devices", true);
                });
            }
            $("#node-config-input-account").on("change", function () {
                const accountId = $("#node-config-input-account").val();
                if (!accountId || $("#node-config-input-duid").val()) {
                    return;
                }
                if (!accountLikelySignedIn(accountId)) {
                    return;
                }
                fetchFromAccount(true);
            });
            $("#rr-fetch-account").on("click", function () {
                fetchFromAccount(!$("#node-config-input-duid").val());
            });
            $("#rr-discover").on("click", function () {
                setStatus("Listening for vacuum announcements on UDP 58866...");
                postJSON("roborock-local/discover", { timeoutMs: 8000 }).done(function (data) {
                    const list = data.devices || [];
                    if (!list.length) {
                        setStatus("No announcements heard. The robot broadcasts occasionally; try again, or type the IP. UDP 58866 must reach this machine.", true);
                        return;
                    }
                    const duid = $("#node-config-input-duid").val();
                    const match = duid ? list.find(function (item) { return item.duid === duid; }) : null;
                    if (match) {
                        $("#node-config-input-ip").val(match.ip);
                        setStatus("Found " + match.duid + " at " + match.ip + ".");
                        return;
                    }
                    const lines = list.map(function (item) {
                        return escapeHtml(item.duid) + " · " + escapeHtml(item.ip) + " · " + escapeHtml(item.version);
                    }).join("<br>");
                    $("#rr-device-list").html("<div class='form-tips'>Heard on the LAN:<br>" + lines + "</div>");
                    if (list.length === 1 && !$("#node-config-input-ip").val()) {
                        $("#node-config-input-ip").val(list[0].ip);
                        if (!$("#node-config-input-duid").val()) {
                            $("#node-config-input-duid").val(list[0].duid);
                        }
                    }
                    setStatus("Heard " + list.length + " announcement(s).");
                }).fail(function (xhr) {
                    setStatus((xhr.responseJSON && xhr.responseJSON.error) || "Discovery failed", true);
                });
            });
            $("#rr-show-maps").on("click", function () {
                showMaps();
            });
        }
    });
})();
</script>
