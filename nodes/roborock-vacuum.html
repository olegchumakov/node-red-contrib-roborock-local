<script type="text/html" data-template-name="roborock-vacuum">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="node-red:common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]node-red:common.label.name">
    </div>
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-android"></i> <span data-i18n="roborock-vacuum.label.device"></span></label>
        <input type="text" id="node-input-device">
    </div>
    <div class="form-row">
        <label for="node-input-command"><i class="fa fa-terminal"></i> <span data-i18n="roborock-vacuum.label.command"></span></label>
        <input type="text" id="node-input-command" data-i18n="[placeholder]roborock-vacuum.placeholder.command">
    </div>
    <div class="form-row">
        <label for="node-input-pollInterval"><i class="fa fa-clock-o"></i> <span data-i18n="roborock-vacuum.label.poll"></span></label>
        <input type="number" id="node-input-pollInterval" min="0" step="1" style="width:80px">
        <span data-i18n="roborock-vacuum.label.seconds"></span>
    </div>
    <div class="form-row">
        <label for="node-input-statusOnChange">&nbsp;</label>
        <input type="checkbox" id="node-input-statusOnChange" style="width:auto; margin-top:0">
        <label for="node-input-statusOnChange" style="width:auto"> <span data-i18n="roborock-vacuum.label.onChange"></span></label>
    </div>
    <div class="form-tips" data-i18n="roborock-vacuum.tip"></div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("roborock-vacuum", {
        category: "Roborock",
        color: "#c0392b",
        defaults: {
            name: { value: "" },
            device: { value: "", type: "roborock-device", required: true },
            command: { value: "" },
            pollInterval: { value: 0, validate: function (v) { return v === "" || !isNaN(Number(v)); } },
            statusOnChange: { value: true }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: function (index) {
            return this._("roborock-vacuum.outputs." + (index === 0 ? "result" : "status"));
        },
        icon: "roborock.svg",
        paletteLabel: "vacuum",
        label: function () {
            return this.name || this._("roborock-vacuum.name");
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        }
    });
</script>
