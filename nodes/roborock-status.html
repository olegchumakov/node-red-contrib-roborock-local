<script type="text/html" data-template-name="roborock-status">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="node-red:common.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]node-red:common.label.name">
    </div>
    <div class="form-row">
        <label for="node-input-device"><i class="fa fa-android"></i> <span data-i18n="roborock-status.label.device"></span></label>
        <input type="text" id="node-input-device">
    </div>
    <div class="form-row">
        <label for="node-input-pollInterval"><i class="fa fa-clock-o"></i> <span data-i18n="roborock-status.label.poll"></span></label>
        <input type="number" id="node-input-pollInterval" min="0" step="1" style="width:80px">
        <span data-i18n="roborock-status.label.seconds"></span>
    </div>
    <div class="form-row">
        <label for="node-input-lowBattery"><i class="fa fa-battery-quarter"></i> <span data-i18n="roborock-status.label.lowBattery"></span></label>
        <input type="number" id="node-input-lowBattery" min="0" max="100" step="1" style="width:80px">
        <span data-i18n="roborock-status.label.percent"></span>
    </div>
    <div class="form-row">
        <label for="node-input-statusOnChange">&nbsp;</label>
        <input type="checkbox" id="node-input-statusOnChange" style="width:auto; margin-top:0">
        <label for="node-input-statusOnChange" style="width:auto"> <span data-i18n="roborock-status.label.onChange"></span></label>
    </div>
    <div class="form-tips" data-i18n="roborock-status.tip"></div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("roborock-status", {
        category: "Roborock",
        color: "#c0392b",
        defaults: {
            name: { value: "" },
            device: { value: "", type: "roborock-device", required: true },
            pollInterval: { value: 30, validate: function (v) { return v === "" || (!isNaN(Number(v)) && Number(v) >= 0); } },
            lowBattery: { value: 20, validate: function (v) { return v === "" || (!isNaN(Number(v)) && Number(v) >= 0 && Number(v) <= 100); } },
            statusOnChange: { value: true }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: function (index) {
            return this._(index === 0 ? "roborock-status.outputs.status" : "roborock-status.outputs.events");
        },
        icon: "roborock.svg",
        paletteLabel: "status",
        label: function () {
            return this.name || this._("roborock-status.name");
        },
        labelStyle: function () {
            return this.name ? "node_label_italic" : "";
        }
    });
</script>
