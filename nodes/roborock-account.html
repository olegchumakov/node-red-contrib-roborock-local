<script type="text/html" data-template-name="roborock-account">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> <span data-i18n="node-red:common.label.name"></span></label>
        <input type="text" id="node-config-input-name" data-i18n="[placeholder]roborock-account.placeholder.name">
    </div>
    <div class="form-row">
        <label for="node-config-input-email"><i class="fa fa-envelope"></i> <span data-i18n="roborock-account.label.email"></span></label>
        <input type="text" id="node-config-input-email" placeholder="you@example.com" autocomplete="off">
    </div>
    <div class="form-row">
        <label for="node-config-input-region"><i class="fa fa-globe"></i> <span data-i18n="roborock-account.label.region"></span></label>
        <select id="node-config-input-region" style="width:70%">
            <option value="auto" data-i18n="roborock-account.region.auto"></option>
            <option value="ru" data-i18n="roborock-account.region.ru"></option>
            <option value="eu" data-i18n="roborock-account.region.eu"></option>
            <option value="us" data-i18n="roborock-account.region.us"></option>
            <option value="cn" data-i18n="roborock-account.region.cn"></option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-config-input-baseUrl"><i class="fa fa-link"></i> <span data-i18n="roborock-account.label.baseUrl"></span></label>
        <input type="text" id="node-config-input-baseUrl" data-i18n="[placeholder]roborock-account.placeholder.baseUrl">
    </div>
    <div class="form-tips" data-i18n="roborock-account.tipUrl"></div>
    <div class="form-row">
        <button type="button" class="red-ui-button" id="rr-account-send" data-i18n="roborock-account.sendCode"></button>
        <input type="text" id="rr-account-code" data-i18n="[placeholder]roborock-account.placeholder.code" style="width:30%" autocomplete="off">
        <button type="button" class="red-ui-button" id="rr-account-code-login" data-i18n="roborock-account.loginCode"></button>
    </div>
    <div class="form-row">
        <input type="password" id="rr-account-password" data-i18n="[placeholder]roborock-account.placeholder.password" style="width:50%" autocomplete="new-password">
        <button type="button" class="red-ui-button" id="rr-account-pass-login" data-i18n="roborock-account.loginPassword"></button>
    </div>
    <div class="form-row">
        <label for="rr-account-import"><i class="fa fa-paste"></i> <span data-i18n="roborock-account.label.haSession"></span></label>
        <textarea id="rr-account-import" rows="3" style="width:70%" data-i18n="[placeholder]roborock-account.placeholder.haSession" autocomplete="off"></textarea>
    </div>
    <div class="form-row">
        <button type="button" class="red-ui-button" id="rr-account-import-btn" data-i18n="roborock-account.importSession"></button>
    </div>
    <div class="form-tips" id="rr-account-status" data-i18n="roborock-account.tip"></div>
    <input type="password" id="node-config-input-userData" style="display:none" autocomplete="off">
    <input type="hidden" id="node-config-input-clientId">
</script>

<script type="text/javascript">
(function () {
    function t(key, options) {
        return RED._("roborock-account." + key, options);
    }
    function postJSON(url, body) {
        return $.ajax({
            url: url,
            type: "POST",
            contentType: "application/json; charset=UTF-8",
            data: JSON.stringify(body),
            dataType: "json"
        });
    }
    function setStatus(text, isError) {
        $("#rr-account-status").text(text).css("color", isError ? "#a00" : "");
    }
    RED.nodes.registerType("roborock-account", {
        category: "config",
        defaults: {
            name: { value: "" },
            region: { value: "auto" },
            baseUrl: { value: "" }
        },
        credentials: {
            email: { type: "text" },
            clientId: { type: "text" },
            userData: { type: "password" }
        },
        label: function () {
            return this.name || this.credentials && this.credentials.email || this._("roborock-account.name");
        },
        oneditprepare: function () {
            const node = this;
            node._sessionUserData = null;
            function payload() {
                return {
                    nodeId: node.id,
                    email: $("#node-config-input-email").val(),
                    region: $("#node-config-input-region").val(),
                    baseUrl: $("#node-config-input-baseUrl").val(),
                    clientId: $("#node-config-input-clientId").val()
                };
            }
            function remember(data) {
                if (data.clientId) {
                    $("#node-config-input-clientId").val(data.clientId);
                }
                if (data.baseUrl) {
                    $("#node-config-input-baseUrl").val(data.baseUrl);
                }
                if (data.userData) {
                    node._sessionUserData = data.userData;
                    $("#node-config-input-userData").val(JSON.stringify(data.userData));
                }
                if (data.email && !$("#node-config-input-email").val()) {
                    $("#node-config-input-email").val(data.email);
                }
            }
            $("#rr-account-send").on("click", function () {
                setStatus(t("requesting"));
                postJSON("roborock-local/send-code", payload()).done(function (data) {
                    remember(data);
                    setStatus(data.message || t("codeSent"));
                }).fail(function (xhr) {
                    setStatus((xhr.responseJSON && xhr.responseJSON.error) || t("sendFailed"), true);
                });
            });
            $("#rr-account-code-login").on("click", function () {
                setStatus(t("signingIn"));
                postJSON("roborock-local/login", Object.assign(payload(), { code: $("#rr-account-code").val() }))
                    .done(function (data) {
                        remember(data);
                        setStatus((data.message || t("signedIn")) + " " + t("next"));
                    })
                    .fail(function (xhr) {
                        setStatus((xhr.responseJSON && xhr.responseJSON.error) || t("loginFailed"), true);
                    });
            });
            $("#rr-account-import-btn").on("click", function () {
                const pasted = $("#rr-account-import").val();
                setStatus(t("checking"));
                postJSON("roborock-local/import-session", Object.assign(payload(), { userData: pasted }))
                    .done(function (data) {
                        $("#rr-account-import").val("");
                        remember(data);
                        setStatus((data.message || t("imported")) + " " + t("next"));
                    })
                    .fail(function (xhr) {
                        setStatus((xhr.responseJSON && xhr.responseJSON.error) || t("importFailed"), true);
                    });
            });
            $("#rr-account-pass-login").on("click", function () {
                setStatus(t("signingInPassword"));
                postJSON("roborock-local/login", Object.assign(payload(), { password: $("#rr-account-password").val() }))
                    .done(function (data) {
                        remember(data);
                        $("#rr-account-password").val("");
                        setStatus((data.message || t("signedIn")) + " " + t("next"));
                    })
                    .fail(function (xhr) {
                        setStatus((xhr.responseJSON && xhr.responseJSON.error) || t("loginFailed"), true);
                    });
            });
        },
        oneditsave: function () {
            if (this._sessionUserData) {
                $("#node-config-input-userData").val(JSON.stringify(this._sessionUserData));
            }
        }
    });
})();
</script>
