<script type="text/html" data-help-name="roborock-account">
    <p>Входит в аккаунт Roborock, чтобы <b>roborock device</b> получил DUID и локальный ключ пылесоса. Повседневное управление облако не использует.</p>
    <h3>Поля</h3>
    <dl class="message-properties">
        <dt>Email, Регион</dt>
        <dd>Адрес из приложения Roborock. Регион определяется по нему; если не получилось, выберите Россию, Европу, США или Китай.</dd>
        <dt>Отправить код, Войти по коду</dt>
        <dd>Отправляет код на почту и входит по нему.</dd>
        <dt>Войти по паролю</dt>
        <dd>Для аккаунтов с паролем.</dd>
        <dt>Сессия Home Assistant</dt>
        <dd>Вставьте <code>data.user_data</code> (или всю запись <code>roborock</code>) из <code>.storage/core.config_entries</code> Home Assistant и импортируйте её вместо входа по коду.</dd>
    </dl>
    <h3>Подробности</h3>
    <ul>
        <li>Нажмите <b>Done</b>, затем <b>Получить устройства из аккаунта</b> в ноде устройства. Deploy между этим не нужен.</li>
        <li>Сессия хранится в credentials, а не в файле потока, и не попадает в лог. Один аккаунт может обслуживать несколько пылесосов.</li>
        <li>Ключ меняется, если робота удалили из приложения и добавили заново или сбросили Wi-Fi. Войдите, получите устройство заново и сделайте Deploy.</li>
        <li>Ошибка Roborock 2018: код неверный или просрочен, отправьте новый. 3009 / 3006: примите пользовательское соглашение в приложении Roborock. 9002: слишком много кодов, подождите.</li>
        <li>Неофициальный пакет, не связан с Roborock.</li>
    </ul>
</script>
