<script type="text/html" data-help-name="roborock-command">
    <p>Отправляет роботу одно простое действие: start, pause, stop, dock, find или spot.</p>
    <h3>Входы</h3>
    <dl class="message-properties">
        <dt class="optional">payload <span class="property-type">string</span></dt>
        <dd>Заменяет действие, выбранное в ноде: <code>start</code> (<code>resume</code>), <code>pause</code>, <code>stop</code>, <code>dock</code> (<code>home</code>, <code>charge</code>, <code>return</code>), <code>find</code> (<code>locate</code>), <code>spot</code>. Всё остальное отклоняется.</dd>
    </dl>
    <h3>Выходы</h3>
    <dl class="message-properties">
        <dt>payload</dt><dd>ответ робота</dd>
        <dt>command, method</dt><dd>действие и отправленный RPC-метод</dd>
        <dt>status</dt><dd>последнее известное состояние робота</dd>
        <dt>retried</dt><dd><code>true</code>, если отклонённый dock был повторён</dd>
    </dl>
    <h3>Подробности</h3>
    <ul>
        <li>Сразу после паузы робот может отклонить <b>dock</b> с <code>action locked (-10003)</code>. Нода повторяет его один раз примерно через 12 секунд. Другие действия и ошибки не повторяются.</li>
        <li>Входящее сообщение сохраняется: <code>msg.topic</code> и ваши свойства проходят дальше.</li>
        <li>Для команд, которых здесь нет, используйте <b>roborock-vacuum</b>.</li>
    </ul>
</script>
