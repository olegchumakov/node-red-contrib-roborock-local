<script type="text/html" data-help-name="roborock-maps">
    <p>Показывает этажи и id комнат или переключает активный этаж.</p>
    <h3>Вход</h3>
    <dl class="message-properties">
        <dt class="optional">action <span class="property-type">string</span></dt>
        <dd><code>read</code> или <code>load</code>. Также читается из <code>msg.payload.action</code>.</dd>
        <dt class="optional">mapFlag <span class="property-type">number</span></dt>
        <dd>Этаж для загрузки. Также читается из <code>msg.payload.mapFlag</code>.</dd>
    </dl>
    <h3>Выход</h3>
    <p><code>msg.payload</code> — <code>{currentMapFlag, maps:[{name, mapFlag, current, segments:[{segmentId, name?}]}]}</code>, тот же список, что <b>Show maps &amp; rooms</b> в устройстве. У незагруженных этажей показаны ранее запомненные комнаты с <code>cached</code> и <code>cachedAt</code>.</p>
    <p><b>read</b> робота не меняет. <b>load</b> отправляет <code>load_multi_map</code>, читает комнаты нового этажа и запоминает их. Пока робот убирает, загрузка отклоняется. Она меняет активный этаж робота, используйте её осознанно.</p>
</script>
