<script type="text/html" data-help-name="roborock-device">
    <p>Параметры подключения к одному пылесосу Roborock. Все ноды Roborock, которые ссылаются на это устройство, используют одно локальное TCP-соединение.</p>
    <h3>Поля</h3>
    <dl class="message-properties">
        <dt>Аккаунт, Получить устройства из аккаунта</dt>
        <dd>Показывает пылесосы аккаунта <b>roborock account</b> и заполняет DUID, локальный ключ и модель. Если в аккаунте один пылесос, а DUID пуст, поля заполнятся сами.</dd>
        <dt>IP</dt>
        <dd>Адрес робота. Облако его обычно не отдаёт: нажмите <b>Найти в сети</b> (слушает UDP 58866 около 8 секунд) или впишите адрес. Если ничего не пришло, впишите IP. Если порт занят, его использует другое приложение на этой машине.</dd>
        <dt>DUID, Локальный ключ, Модель</dt>
        <dd>Заполняются при получении из аккаунта или вводятся вручную, если они уже есть.</dd>
        <dt>Протокол</dt>
        <dd><b>Авто</b> (рекомендуется), <b>1.0</b> или <b>L01</b>. Авто берёт версию, которая сработала в прошлый раз, иначе ту, что сообщает облако, иначе 1.0, а затем пробует другую. Рабочая версия запоминается для устройства. Некоторые модели, например S8 Pro Ultra, в локальной сети отвечают только по L01, даже если облако сообщает 1.0. Явно выбранные 1.0 или L01 не перепроверяются и дают <code>No CONNACK</code>, если робот их не знает.</dd>
        <dt>Показать карты и комнаты</dt>
        <dd>Выводит этажи и id комнат. <b>Обновить</b> перечитывает загруженный этаж и робота не меняет. <b>Загрузить эту карту</b> сначала спрашивает, затем переключает робота на этаж, читает его комнаты и запоминает их (пока робот убирает, отказ). Запомненные комнаты показываются с пометкой «сохранено», когда загружен другой этаж.</dd>
    </dl>
    <h3>Подробности</h3>
    <ul>
        <li>IP, DUID, локальный ключ и модель — это credentials Node-RED. Они не входят в конфиг ноды и не попадают в экспорт потока. Перед переносом файла потоков на другую машину задайте постоянный <code>credentialSecret</code> в <code>settings.js</code>.</li>
        <li>Комнаты появляются только после того, как их хотя бы раз назвали в приложении Roborock. Пока этого не сделано, робот их не сообщает.</li>
        <li>Повторное добавление робота или сброс Wi-Fi меняет локальный ключ. Получите устройство заново и сделайте Deploy. Таймауты и <code>decrypt failed</code> означают устаревший ключ или неверный IP.</li>
        <li>Admin API <code>POST /flows</code> принимает «сырой» массив. Секреты кладите в объект <code>credentials</code> ноды:</li>
    </ul>
    <pre>[
  {
    "id": "device1",
    "type": "roborock-device",
    "name": "Vacuum",
    "protocol": "auto",
    "credentials": {
      "ip": "192.168.1.20",
      "duid": "YOUR_DUID",
      "localKey": "YOUR_LOCAL_KEY",
      "model": "roborock.vacuum.xxx"
    }
  }
]</pre>
</script>
