<script type="text/html" data-help-name="roborock-status">
    <p>Сообщает, что делает робот, и когда это меняется.</p>
    <h3>Входы</h3>
    <p>Любое сообщение читает статус сейчас и отправляет его на выход 1, даже если ничего не изменилось.</p>
    <h3>Выходы</h3>
    <ol class="node-ports">
        <li>Статус. <code>msg.kind</code> = <code>status</code>, входящий <code>msg.topic</code> сохраняется. В <code>msg.payload</code>: <code>stateName</code> (cleaning, returning, charging, idle, paused, error, ...), <code>battery</code>, <code>errorName</code>, <code>fanName</code>, <code>cleanAreaM2</code>. При включённом «только при изменении» отправляются смены состояния, заряда, ошибки, мощности и карты.</li>
        <li>События. <code>msg.payload</code> и <code>msg.event</code> — имя события, <code>msg.kind</code> = <code>event</code>, <code>msg.status</code> — статус. События — не ответы, поэтому входящее сообщение к ним не добавляется.</li>
    </ol>
    <h3>Подробности</h3>
    <ul>
        <li><code>cleaning-started</code>, <code>paused</code>, <code>resumed</code>, <code>error</code>, <code>error-cleared</code>. Продолжение после паузы — не новый старт.</li>
        <li><code>cleaning-finished</code> приходит, когда флаг робота <code>in_cleaning</code> сбрасывается в 0. На паузе флаг остаётся установленным, но робот сбрасывает его, как только его отправили домой, поэтому событие приходит в момент начала возврата на базу, а не когда робот уже встал на док.</li>
        <li><code>low-battery</code> приходит один раз, когда заряд опускается до порога, и снова только после того как поднимется выше.</li>
        <li>События считаются по сравнению с прошлым замером, поэтому первый замер после Deploy их не даёт.</li>
        <li>Опрос в секундах. Ноды одного устройства используют одно соединение, действует самый короткий интервал.</li>
    </ul>
</script>
