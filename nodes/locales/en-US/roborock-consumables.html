<script type="text/html" data-help-name="roborock-consumables">
    <p>Reads how worn the main brush, side brush, filter and sensors are.</p>
    <h3>Inputs</h3>
    <p>Any message triggers a read. Put an inject node with a repeat in front of it for a daily check.</p>
    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>All parts. <code>msg.kind</code> is <code>consumables</code> and the incoming <code>msg.topic</code> is kept. <code>msg.payload.parts</code> has <code>mainBrush</code>, <code>sideBrush</code>, <code>filter</code> and <code>sensor</code> (those the robot reports), each with <code>usedHours</code>, <code>remainingHours</code> and <code>remainingPercent</code>. <code>msg.payload.raw</code> is the unchanged reply, and <code>msg.low</code> lists the parts at or below the warning level.</li>
        <li>Worn parts. Sent only when a part is at or below the warning level. <code>msg.payload</code> is the list of part names and <code>msg.kind</code> is <code>consumables-low</code>.</li>
    </ol>
    <h3>Details</h3>
    <ul>
        <li>Service lives: main brush 300 h, side brush 200 h, filter 150 h, sensors 30 h.</li>
        <li>Warn at is a percentage of life left; 0 turns the warning off.</li>
    </ul>
</script>
