<script type="text/html" data-help-name="roborock-maps">
    <p>Lists floors and room ids, or switches the active floor.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">action <span class="property-type">string</span></dt>
        <dd><code>read</code> or <code>load</code>. Also read from <code>msg.payload.action</code>.</dd>
        <dt class="optional">mapFlag <span class="property-type">number</span></dt>
        <dd>The floor to load. Also read from <code>msg.payload.mapFlag</code>.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload</dt>
        <dd><code>{currentMapFlag, maps:[{name, mapFlag, current, segments:[{segmentId, name?}]}]}</code>, the same list as <b>Show maps &amp; rooms</b> on the device. A floor that is not loaded shows rooms saved earlier, with <code>cached</code> and <code>cachedAt</code>.</dd>
    </dl>
    <h3>Details</h3>
    <ul>
        <li><b>read</b> does not change the robot.</li>
        <li><b>load</b> sends <code>load_multi_map</code>, reads the new floor's rooms and keeps them. It changes the robot's active floor and is refused while the robot is cleaning. A floor that is already loaded is only re-read.</li>
        <li><b>Name the rooms in the Roborock app at least once.</b> The robot does not report unnamed rooms, so none are listed until then, even on the loaded floor.</li>
        <li>Rooms of a floor that is not loaded come from the saved copy. To get them, load that floor once.</li>
    </ul>
</script>
