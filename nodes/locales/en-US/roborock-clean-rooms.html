<script type="text/html" data-help-name="roborock-clean-rooms">
    <p>Cleans chosen rooms, optionally on a chosen floor and with a chosen fan speed and mop level.</p>
    <h3>Inputs</h3>
    <p>Any message starts the clean with the node's settings. These properties override them:</p>
    <dl class="message-properties">
        <dt class="optional">segments <span class="property-type">array | string</span></dt>
        <dd>Room ids, for example <code>[16, 17]</code> or <code>"16,17"</code>. <code>msg.rooms</code> is accepted as another name.</dd>
        <dt class="optional">names <span class="property-type">array | string</span></dt>
        <dd>Room names. A name must match exactly one room on the floor being cleaned. <code>"16"</code> and <code>"Room 16"</code> mean id 16.</dd>
        <dt class="optional">mapFlag, repeat, fan, mop</dt>
        <dd>Floor, repeats (1-3), fan speed, mop level. The same keys work inside an object <code>msg.payload</code>.</dd>
        <dt class="optional">payload <span class="property-type">array | object</span></dt>
        <dd>Names rooms only when it says so: an array (numbers are ids, text is names) or an object with <code>segments</code>, <code>rooms</code> or <code>names</code>. A number, string or boolean, such as the default inject timestamp, is ignored.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload</dt><dd>the robot's reply to <code>app_segment_clean</code></dd>
        <dt>segments</dt><dd>the room ids that were sent</dd>
        <dt>floorSwitched</dt><dd>whether the floor was changed first</dd>
    </dl>
    <h3>Details</h3>
    <ul>
        <li><b>Pick rooms from the robot</b> lists the rooms of the deployed device. The robot reports a room only after it has been named in the Roborock app at least once.</li>
        <li>Room ids repeat between floors, so the floor is stored with the rooms. When it is set and another floor is loaded, the node loads it first. It refuses while the robot is cleaning, and cleans nothing if the floor does not switch. A floor that is already loaded is not reloaded. With the floor empty, the loaded floor is cleaned.</li>
    </ul>
</script>
