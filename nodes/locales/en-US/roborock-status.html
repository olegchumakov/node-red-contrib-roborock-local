<script type="text/html" data-help-name="roborock-status">
    <p>Reports what the robot is doing and tells you when that changes.</p>
    <h3>Input</h3>
    <p>Any message reads the status now and sends it on output 1, even if nothing changed.</p>
    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Status. <code>msg.kind</code> is <code>status</code> and the incoming <code>msg.topic</code> is kept. <code>msg.payload</code> has <code>stateName</code> (cleaning, returning, charging, idle, paused, error, ...), <code>battery</code>, <code>errorName</code>, <code>fanName</code>, <code>cleanAreaM2</code>. With <i>only when it changes</i> on, state, battery, error, fan and map changes are sent.</li>
        <li>Events. <code>msg.payload</code> and <code>msg.event</code> are the event name, <code>msg.kind</code> is <code>event</code>, and <code>msg.status</code> is the status: <code>cleaning-started</code>, <code>cleaning-finished</code>, <code>paused</code>, <code>resumed</code>, <code>error</code>, <code>error-cleared</code>, <code>low-battery</code>. A pause is not the end of a clean and a resume is not a new start: <code>cleaning-finished</code> is sent only when the clean really ends (the robot's <code>in_cleaning</code> flag stays set while paused and while returning to the dock). Events are not replies, so they carry no incoming message. <code>low-battery</code> is sent once when the level drops to the set value and again only after it has climbed above it. Events are compared against the previous sample, so the first sample after a deploy sends none.</li>
    </ol>
    <p>The poll interval is in seconds. Nodes that share a device share one connection, and the shortest poll interval wins.</p>
</script>
